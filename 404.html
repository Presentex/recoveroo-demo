<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Recoveroo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
      (function () {
        var path = location.pathname;
        var marker = "/recoveroo-demo/";
        var at = path.indexOf(marker);
        var base = at >= 0 ? path.slice(0, at + marker.length) : path.replace(/[^/]*$/, "");
        if (!base.endsWith("/")) base += "/";
        location.replace(base + (location.hash || "#/welcome"));
      })();
    </script>
  </head>
  <body>
    <p><a href="./">Recoveroo</a></p>
  </body>
</html>
